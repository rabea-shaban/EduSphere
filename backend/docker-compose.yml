version: '3.8'

services:
  # Backend Express API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edusphere_backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "5000:5000"
    depends_on:
      - redis
    networks:
      - edusphere_network

  # Redis Cache Service
  redis:
    image: redis:7-alpine
    container_name: edusphere_redis
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - edusphere_network

  # Nginx Reverse Proxy & Load Balancer
  nginx:
    image: nginx:alpine
    container_name: edusphere_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
    networks:
      - edusphere_network

networks:
  edusphere_network:
    driver: bridge

volumes:
  redis_data:
    driver: local
  nginx_logs:
    driver: local
